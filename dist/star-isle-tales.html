<!DOCTYPE html>

<script>
/* js/engine.js */
'use strict';
// ============ 基础常量与工具 ============
const TS = 16, VW = 320, VH = 180;
const FONT = '"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC","Noto Sans SC","Source Han Sans SC","WenQuanYi Micro Hei",sans-serif';

function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
function lerp(a, b, t) { return a + (b - a) * t; }
function rand(a, b) { return a + Math.random() * (b - a); }
function randi(a, b) { return Math.floor(a + Math.random() * (b - a + 1)); }
function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
function chance(p) { return Math.random() < p; }
function hash2(x, y, s) {
  let h = (Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263) + Math.imul((s || 0) | 0, 1442695041)) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function rpick(R, arr) { return arr[Math.floor(R() * arr.length)]; }
function rint(R, a, b) { return Math.floor(a + R() * (b - a + 1)); }
function shuffle(arr, R) { R = R || Math.random; for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(R() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; }
function rectsOverlap(a, b) { return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y; }
const DIRS = [[0, 1], [0, -1], [-1, 0], [1, 0]]; // 下 上 左 右
const DIR_NAMES = ['down', 'up', 'left', 'right'];
function deepCopy(o) { return JSON.parse(JSON.stringify(o)); }

// ============ 计时器（随游戏循环推进） ============
const Timers = {
  list: [],
  update(dt) {
    for (let i = this.list.length - 1; i >= 0; i--) {
      const t = this.list[i];
      t.t -= dt;
      if (t.t <= 0) { this.list.splice(i, 1); t.fn(); }
    }
  }
};
function wait(sec) { return new Promise(res => Timers.list.push({ t: sec, fn: res })); }

// ============ 输入 ============
const Input = {
  held: {}, pressed: {}, rep: {}, rt: {}, any: false,
  keymap: {
    ArrowUp: 'up', KeyW: 'up', ArrowDown: 'down', KeyS: 'down', ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right',
    KeyJ: 'a', Space: 'a', KeyZ: 'a', Enter: 'a', NumpadEnter: 'a',
    KeyK: 'b', KeyX: 'b', Backspace: 'b',
    KeyI: 'menu', Tab: 'menu', Escape: 'menu',
    KeyQ: 'prev', KeyE: 'next', KeyM: 'mute', KeyF: 'full',
    Digit1: 's0', Digit2: 's1', Digit3: 's2', Digit4: 's3', Digit5: 's4', Digit6: 's5', Digit7: 's6', Digit8: 's7', Digit9: 's8', Digit0: 's9',
  },
  init() {
    window.addEventListener('keydown', e => {
      const act = this.keymap[e.code];
      Sfx.init();
      if (act) {
        e.preventDefault();
        if (!this.held[act]) { this.pressed[act] = true; this.rep[act] = true; this.rt[act] = 0.32; }
        this.held[act] = true;
        this.any = true;
      }
    });
    window.addEventListener('keyup', e => {
      const act = this.keymap[e.code];
      if (act) { this.held[act] = false; e.preventDefault(); }
    });
    window.addEventListener('blur', () => { this.held = {}; });
  },
  press(act) { if (!this.held[act]) { this.pressed[act] = true; this.rep[act] = true; this.rt[act] = 0.32; } this.held[act] = true; this.any = true; Sfx.init(); },
  release(act) { this.held[act] = false; },
  update(dt) {
    for (const k in this.held) {
      if (this.held[k]) {
        this.rt[k] -= dt;
        if (this.rt[k] <= 0) { this.rep[k] = true; this.rt[k] = 0.075; }
      }
    }
  },
  endFrame() { this.pressed = {}; this.rep = {}; this.any = false; },
  // 菜单导航：首次按下立即触发，长按自动重复
  nav(act) { return !!this.rep[act]; },
  hit(act) { return !!this.pressed[act]; },
  consume(act) { this.pressed[act] = false; this.rep[act] = false; },
  clear() { this.pressed = {}; this.rep = {}; },
};

// ============ 音效（WebAudio 合成，无需任何文件） ============
const Sfx = {
  ctx: null, master: null, muted: false, sfxGain: null, musGain: null,
  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      this.ctx = new AC();
      this.master = this.ctx.createGain(); this.master.gain.value = this.muted ? 0 : 0.5; this.master.connect(this.ctx.destination);
      this.sfxGain = this.ctx.createGain(); this.sfxGain.gain.value = 0.45; this.sfxGain.connect(this.master);
      this.musGain = this.ctx.createGain(); this.musGain.gain.value = 0.22; this.musGain.connect(this.master);

  toggle() { this.muted = !this.muted; if (this.master) this.master.gain.value = this.muted ? 0 : 0.5; return this.muted; },
  tone(freq, dur, type, vol, slide, delay) {

    g.gain.setValueAtTime(vol || 0.2, t0); g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    o.connect(g); g.connect(this.sfxGain); o.start(t0); o.stop(t0 + dur + 0.02);
  },
  noise(dur, vol, freq, delay) {
    if (!this.ctx || this.muted) return;
    const t0 = this.ctx.currentTime + (delay || 0);
    const n = Math.floor(this.ctx.sampleRate * dur);
    const buf = this.ctx.createBuffer(1, n, this.ctx.sampleRate), d = buf.getChannelData(0);

    const g = this.ctx.createGain(); g.gain.setValueAtTime(vol || 0.3, t0); g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);

  },
  play(name) {
    switch (name) {

      case 'hit': this.tone(220, 0.1, 'square', 0.2, -120); this.noise(0.08, 0.2, 1500); break;

      case 'coin': this.tone(988, 0.07, 'square', 0.12); this.tone(1319, 0.2, 'square', 0.12, 0, 0.07); break;
      case 'pickup': this.tone(660, 0.06, 'square', 0.1); this.tone(880, 0.1, 'square', 0.1, 0, 0.06); break;
      case 'select': this.tone(880, 0.04, 'square', 0.08); break;

      case 'text': this.tone(520 + Math.random() * 80, 0.025, 'square', 0.04); break;
      case 'till': this.noise(0.12, 0.3, 600); break;

      case 'plant': this.tone(400, 0.06, 'triangle', 0.15, 200); break;
      case 'harvest': this.tone(523, 0.06, 'square', 0.1); this.tone(784, 0.12, 'square', 0.1, 0, 0.06); break;
      case 'rock': this.noise(0.15, 0.35, 900); this.tone(150, 0.1, 'square', 0.15, -60); break;

      case 'cut': this.noise(0.12, 0.25, 2500); break;
      case 'door': this.tone(200, 0.12, 'triangle', 0.15, 80); this.noise(0.1, 0.1, 800, 0.05); break;
      case 'bow': this.tone(900, 0.1, 'triangle', 0.12, -600); break;
      case 'bomb': this.noise(0.5, 0.5, 500); this.tone(80, 0.4, 'sawtooth', 0.3, -40); break;
      case 'fire': this.noise(0.3, 0.25, 1800); this.tone(300, 0.2, 'sawtooth', 0.08, 300); break;
      case 'secret': [523, 659, 784, 1047].forEach((f, i) => this.tone(f, 0.15, 'square', 0.1, 0, i * 0.1)); break;
      case 'item': [523, 659, 784, 1047, 784, 1047].forEach((f, i) => this.tone(f, 0.14, 'square', 0.1, 0, i * 0.09)); break;
      case 'levelup': [523, 659, 784, 1047].forEach((f, i) => this.tone(f, 0.12, 'triangle', 0.18, 0, i * 0.08)); break;

      case 'shake': this.tone(300, 0.08, 'triangle', 0.15); break;
      case 'splash': this.noise(0.3, 0.25, 2500); break;
      case 'bite': this.tone(1200, 0.08, 'square', 0.15); this.tone(1200, 0.08, 'square', 0.15, 0, 0.12); break;
      case 'fail': this.tone(300, 0.2, 'square', 0.12, -100); this.tone(200, 0.3, 'square', 0.12, -80, 0.2); break;
      case 'step': this.noise(0.03, 0.05, 500); break;
      case 'boss': this.tone(110, 0.6, 'sawtooth', 0.2, -30); this.noise(0.6, 0.2, 300); break;
      case 'warp': for (let i = 0; i < 8; i++) this.tone(400 + i * 120, 0.05, 'sine', 0.1, 0, i * 0.03); break;
      case 'unlock': this.tone(700, 0.05, 'square', 0.12); this.tone(500, 0.1, 'square', 0.12, 0, 0.06); this.noise(0.1, 0.1, 1000, 0.1); break;
    }
  }
};

// ============ 背景音乐（简易芯片音乐序列器） ============
const NOTE = (() => {
  const m = {}; const names = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
  for (let o = 1; o < 8; o++) for (let i = 0; i < 12; i++) m[names[i] + o] = 440 * Math.pow(2, (o * 12 + i - 57) / 12);
  return m;
})();
const SONGS = {
  title: { bpm: 96, lead: 'E5 . G5 . A5 . . G5 E5 . D5 . C5 . . . D5 . E5 . G5 . A5 . C6 . B5 . G5 . . . A5 . . G5 E5 . D5 . E5 . . D5 C5 . A4 . C5 . D5 . E5 . G5 . E5 . . . . . . .', bass: 'C3 . G3 . C3 . G3 . A2 . E3 . A2 . E3 . F2 . C3 . F2 . C3 . G2 . D3 . G2 . D3 . C3 . G3 . C3 . G3 . A2 . E3 . A2 . E3 . F2 . C3 . G2 . D3 . C3 . G2 . C3 . . .', wave: 'triangle' },
  farm: { bpm: 108, lead: 'G4 . C5 . E5 . D5 C5 D5 . E5 . C5 . . . A4 . C5 . F5 . E5 D5 E5 . . . . . . . G4 . C5 . E5 . G5 . A5 . G5 . E5 . C5 . D5 . . . E5 D5 C5 . D5 . C5 . . . . . . .', bass: 'C3 . . . G2 . . . C3 . . . G2 . . . F2 . . . C3 . . . G2 . . . G2 . . . C3 . . . E3 . . . F2 . . . C3 . . . G2 . . . G2 . . . C3 . G2 . C3 . . .', wave: 'square' },
  village: { bpm: 100, lead: 'E5 . D5 . C5 . D5 . E5 . E5 . E5 . . . D5 . D5 . D5 . . . E5 . G5 . G5 . . . E5 . D5 . C5 . D5 . E5 . E5 . E5 . C5 . D5 . D5 . E5 . D5 . C5 . . . . . . .', bass: 'C3 . G3 . C3 . G3 . C3 . G3 . C3 . G3 . G2 . D3 . G2 . D3 . C3 . G3 . C3 . G3 . C3 . G3 . C3 . G3 . C3 . G3 . A2 . E3 . G2 . D3 . G2 . D3 . C3 . G2 . C3 . . .', wave: 'square' },
  field: { bpm: 132, lead: 'C5 . E5 G5 . E5 C5 . D5 . F5 A5 . F5 D5 . E5 . G5 C6 . G5 E5 . D5 . . . G4 . . . C5 . E5 G5 . E5 C5 . D5 . F5 A5 . C6 B5 . A5 . G5 . E5 . C5 . D5 . G5 . C5 . . . . . . .', bass: 'C3 C3 G3 G3 C3 C3 G3 G3 D3 D3 A3 A3 D3 D3 A3 A3 C3 C3 G3 G3 C3 C3 G3 G3 G2 G2 D3 D3 G2 G2 D3 D3 C3 C3 G3 G3 C3 C3 G3 G3 F2 F2 C3 C3 F2 F2 C3 C3 G2 G2 D3 D3 G2 G2 D3 D3 C3 C3 G3 G3 C3 . . .', wave: 'square' },
  forest: { bpm: 90, lead: 'A4 . . C5 E5 . . D5 C5 . . B4 A4 . . . G4 . . B4 D5 . . C5 B4 . . A4 G4 . . . A4 . . C5 E5 . . A5 G5 . . E5 D5 . . . C5 . . B4 A4 . . G4 A4 . . . . . . .', bass: 'A2 . . . E3 . . . A2 . . . E3 . . . G2 . . . D3 . . . G2 . . . D3 . . . F2 . . . C3 . . . F2 . . . C3 . . . E2 . . . B2 . . . A2 . . . E3 . . .', wave: 'triangle' },
  dungeon: { bpm: 112, lead: 'D5 . . D5 F5 . E5 . D5 . . . A4 . . . C5 . . C5 E5 . D5 . C5 . . . A4 . . . D5 . . D5 F5 . A5 . G5 . F5 . E5 . D5 . C#5 . . . E5 . . . D5 . . . . . . .', bass: 'D2 . D3 . D2 . D3 . D2 . D3 . D2 . D3 . C2 . C3 . C2 . C3 . C2 . C3 . C2 . C3 . A#1 . A#2 . A#1 . A#2 . A1 . A2 . A1 . A2 . D2 . D3 . D2 . D3 . D2 . D3 . D2 . D3 .', wave: 'sawtooth' },
  battle: { bpm: 150, lead: 'E5 E5 . E5 . C5 E5 . G5 . . . G4 . . . C5 . . G4 . . E4 . . A4 . B4 . A#4 A4 . G4 E5 G5 A5 . F5 G5 . E5 . C5 D5 B4 . . . C5 . . G4 . . E4 . . A4 . B4 . A#4 A4 . .', bass: 'C3 C3 G3 G3 C3 C3 G3 G3 C3 C3 G3 G3 C3 C3 G3 G3 A2 A2 E3 E3 A2 A2 E3 E3 F2 F2 C3 C3 F2 F2 C3 C3 C3 C3 G3 G3 C3 C3 G3 G3 F2 F2 C3 C3 G2 G2 D3 D3 A2 A2 E3 E3 A2 A2 E3 E3 F2 F2 G2 G2 G2 G2', wave: 'square' },
  boss: { bpm: 160, lead: 'D5 D5 F5 D5 G5 D5 F5 D5 C5 C5 E5 C5 F5 C5 E5 C5 A#4 A#4 D5 A#4 F5 A#4 D5 A#4 A4 A4 C#5 A4 E5 A4 C#5 A4 D5 . A5 . G5 . F5 . E5 . F5 . G5 . A5 . A#5 . A5 . G5 . F5 . E5 . C#5 . A4 . . .', bass: 'D2 D2 D3 D2 D2 D3 D2 D3 C2 C2 C3 C2 C2 C3 C2 C3 A#1 A#1 A#2 A#1 A#1 A#2 A#1 A#2 A1 A1 A2 A1 A1 A2 A1 A2 D2 D2 D3 D2 D2 D3 D2 D3 C2 C2 C3 C2 C2 C3 C2 C3 A#1 A#1 A#2 A#1 A1 A1 A2 A1 A1 A2 A1 A2 A1 A2 A1 A2', wave: 'sawtooth' },
  night: { bpm: 72, lead: 'E5 . . . D5 . C5 . G4 . . . . . . . A4 . . . C5 . E5 . D5 . . . . . . . C5 . . . B4 . A4 . E4 . . . . . . . F4 . A4 . C5 . B4 . G4 . . . . . . .', bass: 'C3 . . . . . . . E2 . . . . . . . F2 . . . . . . . G2 . . . . . . . A2 . . . . . . . E2 . . . . . . . F2 . . . . . . . G2 . . . . . . .', wave: 'sine' },
  snow: { bpm: 84, lead: 'B4 . E5 . F#5 . G5 . F#5 . E5 . B4 . . . A4 . D5 . E5 . F#5 . E5 . D5 . A4 . . . G4 . B4 . E5 . G5 . F#5 . D#5 . B4 . . . C5 . B4 . A4 . F#4 . E4 . . . . . . .', bass: 'E2 . B2 . E3 . B2 . E2 . B2 . E3 . B2 . D2 . A2 . D3 . A2 . D2 . A2 . D3 . A2 . C2 . G2 . C3 . G2 . B1 . F#2 . B2 . F#2 . A1 . E2 . A2 . E2 . B1 . F#2 . B2 . . .', wave: 'triangle' },
  victory: { bpm: 140, lead: 'C5 C5 C5 C5 . . G#4 . A#4 . C5 . . A#4 C5 . . . . . . . . .', bass: 'C3 . . . . . G#2 . A#2 . C3 . . . C3 . . . . . . . . .', wave: 'square', once: true },
};
const Music = {
  cur: null, step: 0, nextTime: 0, timer: null, song: null, want: null,
  start() { if (this.timer) return; this.timer = setInterval(() => this.tick(), 50); },
  play(name) {
    if (this.want === name) return;
    this.want = name;
    this.song = SONGS[name] || null;
    if (this.song && !this.song._lead) {
      this.song._lead = this.song.lead.split(/\s+/);
      this.song._bass = this.song.bass.split(/\s+/);
    }
    this.step = 0;
    if (Sfx.ctx) this.nextTime = Sfx.ctx.currentTime + 0.1;
  },
  tick() {
    const ctx = Sfx.ctx; if (!ctx || !this.song || Sfx.muted) { if (ctx) this.nextTime = ctx.currentTime + 0.1; return; }
    const s = this.song, dur = 60 / s.bpm / 2;
    if (this.nextTime < ctx.currentTime - 0.5) this.nextTime = ctx.currentTime + 0.05;
    while (this.nextTime < ctx.currentTime + 0.2) {
      const len = s._lead.length;
      if (s.once && this.step >= len) { this.song = null; return; }
      const i = this.step % len;
      this.note(s._lead[i], s._lead, i, this.nextTime, dur, s.wave, 0.16);
      this.note(s._bass[i % s._bass.length], s._bass, i % s._bass.length, this.nextTime, dur, 'triangle', 0.22);
      this.nextTime += dur; this.step++;
    }
  },
  note(tok, arr, i, t, dur, wave, vol) {
    if (!tok || tok === '.' || tok === '-') return;
    const f = NOTE[tok]; if (!f) return;
    let n = 1; while (arr[(i + n) % arr.length] === '.' && n < 8) n++;
    const ctx = Sfx.ctx, o = ctx.createOscillator(), g = ctx.createGain();
    o.type = wave; o.frequency.value = f;
    const d = dur * n * 0.92;

const iconCache = {};
function getIcon(item) {
  if (!item) return null;
  const key = item.id;
  if (iconCache[key]) return iconCache[key];
  const tpl = ICON_TPL[item.icon] || ICON_TPL.fruit;
  const col = item.color || '#e0a040';
  const pal = { k: '#2a1c18', a: col, b: shade(col, -0.3), c: shade(col, 0.45), d: item.color2 || '#4caa3a', w: '#ffffff' };
  if (item.icon === 'ore' || item.icon === 'bar') { pal.a = item.icon === 'ore' ? '#8a8a92' : col; pal.c = '#b8b8c0'; pal.b = '#5a5a62'; pal.d = col; if (item.icon === 'bar') { pal.a = col; pal.c = shade(col, 0.5); pal.b = shade(col, -0.3); } }
  if (item.icon === 'pick' || item.icon === 'hoe' || item.icon === 'axe') { pal.a = '#9a6232'; pal.d = col; }
  if (item.icon === 'sword') { pal.c = col; pal.a = '#7a4a24'; pal.d = '#d8b040'; }
  if (item.icon === 'bow') { pal.a = '#9a6232'; }
  if (item.icon === 'arrow') { pal.a = '#9a6232'; pal.d = '#e04848'; pal.w = '#d0d0d8'; }
  if (item.icon === 'bomb') { pal.d = '#ffb020'; }
  if (item.icon === 'firerod') { pal.a = '#9a6232'; pal.d = '#ff5a20'; pal.c = '#ffe060'; }
  if (item.icon === 'rod') { pal.a = '#b07a40'; pal.d = '#e0e0e0'; }
  if (item.icon === 'ball') { pal.d = '#f4f4f4'; }
  if (item.icon === 'potion') { pal.d = '#a07040'; }
  if (item.icon === 'sprinkler') { pal.d = '#6ab0f0'; }
  const c = buildSprite(pad16(tpl), pal);
  iconCache[key] = c;
  return c;
}

const cropCache = {};
function getCropSprite(stage, color) {
  const key = stage + color;
  if (cropCache[key]) return cropCache[key];
  const c = buildSprite(pad16(CROP_TPL[stage]), { k: '#1e3a14', g: '#4caa3a', G: '#2e7a26', d: '#5a3a1a', a: color, c: shade(color, 0.5) });
  cropCache[key] = c;
  return c;
}

function speck(g, R, n, col, w, h) { g.fillStyle = col; for (let i = 0; i < n; i++) g.fillRect(Math.floor(R() * 16), Math.floor(R() * 16), w || 1, h || 1); }
function fill(g, col) { g.fillStyle = col; g.fillRect(0, 0, 16, 16); }
function circ(g, cx, cy, r, col) { g.fillStyle = col; for (let y = -r; y <= r; y++) for (let x = -r; x <= r; x++) if (x * x + y * y <= r * r + r * 0.6) g.fillRect(Math.round(cx + x), Math.round(cy + y), 1, 1); }
function ell(g, cx, cy, rx, ry, col) { g.fillStyle = col; for (let y = -ry; y <= ry; y++) for (let x = -rx; x <= rx; x++) if ((x * x) / (rx * rx + 0.5) + (y * y) / (ry * ry + 0.5) <= 1) g.fillRect(Math.round(cx + x), Math.round(cy + y), 1, 1); }
function rect(g, x, y, w, h, col) { g.fillStyle = col; g.fillRect(x, y, w, h); }

// 每个地块使用哪种"底色"
TILES.forEach(t => { if (!t.base) t.base = null; });
const BASE_OF = { grass: 'GRASS', snow: 'SNOW', sand: 'SAND', rocky: 'ROCKY', cfloor: 'CFLOOR', dfloor: 'DFLOOR', floor: 'FLOOR', path: 'PATH', stone: 'STONE' };

const tileCache = {};
function getTileSprite(id, variant, frame, themeName, baseName) {
  const t = TILES[id];
  const key = id + '|' + variant + '|' + frame + '|' + themeName + '|' + (t.base ? baseName : '');
  let c = tileCache[key];
  if (c) return c;
  c = makeCanvas(16, 16);
  const g = c.getContext('2d');
  const th = THEMES[themeName] || THEMES.forest;
  const R = mulberry32(id * 977 + variant * 131 + 7);
  if (t.base) {
    const bn = baseName || t.base;
    const fn = BASES[bn] || BASES.grass;
    fn(g, mulberry32(variant * 31 + 3), th);
  }
  t.draw(g, R, th, frame || 0);
  tileCache[key] = c;
  return c;
}

// ============ 简易特效粒子 ============
const Particles = {
  list: [],
  add(x, y, n, color, speed, life, grav) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, s = (speed || 40) * (0.4 + Math.random() * 0.8);
      this.list.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - (grav ? 30 : 0), life: (life || 0.5) * (0.6 + Math.random() * 0.6), max: life || 0.5, color, grav: grav || 0, size: Math.random() < 0.3 ? 2 : 1 });
    }
  },
  text(x, y, txt, color) { this.list.push({ x, y, vx: 0, vy: -20, life: 1, max: 1, text: txt, color: color || '#fff' }); },
  update(dt) {
    for (let i = this.list.length - 1; i >= 0; i--) {
      const p = this.list[i];
      p.life -= dt; if (p.life <= 0) { this.list.splice(i, 1); continue; }
      p.x += p.vx * dt; p.y += p.vy * dt; p.vy += p.grav * dt;
      if (!p.text) { p.vx *= 0.96; p.vy *= 0.96; }
    }
  },
  draw(ctx, cx, cy) {
    for (const p of this.list) {
      ctx.globalAlpha = clamp(p.life / p.max * 1.5, 0, 1);
      if (p.text) drawText(ctx, p.text, p.x - cx, p.y - cy, p.color, 8, 'center', true, true);
      else { ctx.fillStyle = p.color; ctx.fillRect(Math.round(p.x - cx), Math.round(p.y - cy), p.size, p.size); }
    }
    ctx.globalAlpha = 1;
  }
};

function newMap(id, w, h, fillName) {

function tAt(m, x, y) { if (x < 0 || y < 0 || x >= m.w || y >= m.h) return -1; return m.t[y * m.w + x]; }

function borderT(m, name, th, gaps) {
  for (let y = 0; y < m.h; y++) for (let x = 0; x < m.w; x++) {
    if (!(x < th || y < th || x >= m.w - th || y >= m.h - th)) continue;
    let gap = false;
    for (const g of gaps || []) {
      if (g[0] === 'n' && y < th && x >= g[1] && x <= g[2]) gap = true;
      if (g[0] === 's' && y >= m.h - th && x >= g[1] && x <= g[2]) gap = true;
      if (g[0] === 'w' && x < th && y >= g[1] && y <= g[2]) gap = true;
      if (g[0] === 'e' && x >= m.w - th && y >= g[1] && y <= g[2]) gap = true;
    }
    if (!gap) setT(m, x, y, name);
  }
}
function scatterT(m, R, name, p, onlyOn, protect) {
  const only = (onlyOn || ['GRASS']).map(n => TILE[n]);
  for (let y = 0; y < m.h; y++) for (let x = 0; x < m.w; x++) {
    if (!only.includes(m.t[y * m.w + x])) continue;
    if (protect && protect.some(r => x >= r[0] && y >= r[1] && x < r[0] + r[2] && y < r[1] + r[3])) continue;

// ============ 头目 ============

// ============ 弹道 ============
class Proj extends Ent {
  constructor(x, y, vx, vy, kind, dmg, owner) { super(x, y); this.vx = vx; this.vy = vy; this.kind = kind; this.dmg = dmg || 1; this.owner = owner || 'enemy'; this.life = 3; this.hb = { x: -3, y: -3, w: 6, h: 6 }; }
  update(dt) {

    const tx = Math.floor(this.x / TS), ty = Math.floor(this.y / TS), t = tileProps(tx, ty);
    if (this.owner === 'player') {
      if (t && t.eye) { triggerEye(tx, ty); this.dead = true; return; }
      if (t && t.crystal) { hitCrystal(tx, ty); this.dead = true; return; }
      for (const e of G.ents) if (!e.dead && e.hittable && rectsOverlap(this.box(), e.box())) { e.hit(this.dmg, this.x - this.vx * 0.05, this.y - this.vy * 0.05, this.kind); this.dead = true; return; }
    } else if (rectsOverlap(this.box(), G.player.box()) && !(this.kind === 'wave' && G.player.z > 3)) { hurtPlayer(this.dmg, this.x - this.vx * 0.1, this.y - this.vy * 0.1); this.dead = true; return; }
    if (tileSolidFor(tx, ty, 'proj')) { this.dead = true; Particles.add(this.x, this.y, 4, SHOT_COLOR[this.kind] || '#ddd', 30, 0.25); }
  }
  draw(ctx, cx, cy) {
    const x = this.x - cx, y = this.y - cy;
    if (this.kind === 'arrow') { ctx.save(); ctx.translate(x, y); ctx.rotate(Math.atan2(this.vy, this.vx)); ctx.fillStyle = '#8a5a2a'; ctx.fillRect(-7, -0.5, 10, 1.5); ctx.fillStyle = '#d0d0d8'; ctx.fillRect(3, -1.5, 3, 3.5); ctx.fillStyle = '#e04848'; ctx.fillRect(-8, -1.5, 2, 3.5); ctx.restore(); return; }
    const c = SHOT_COLOR[this.kind] || '#fff';
    if (this.kind === 'wave') { ctx.fillStyle = c; ctx.fillRect(x - 4, y - 1, 8, 3); ctx.fillStyle = '#fff'; ctx.fillRect(x - 2, y - 1, 4, 1); return; }
    ctx.fillStyle = shade(c, -0.4); ctx.beginPath(); ctx.arc(x, y, 4, 0, 7); ctx.fill();
    ctx.fillStyle = c; ctx.beginPath(); ctx.arc(x, y, 3, 0, 7); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.fillRect(x - 1.5, y - 1.5, 1.5, 1.5);
  }
}
function shoot(x, y, vx, vy, kind, dmg, owner) { const p = new Proj(x, y, vx, vy, kind, dmg, owner); G.ents.push(p); return p; }

class Boomerang extends Ent {
  constructor(p) { super(p.cx() - 4, p.cy() - 8); const d = DIRS[p.dir]; this.vx = d[0] * 230; this.vy = d[1] * 230; this.t = 0.55; this.back = false; this.hb = { x: 0, y: 0, w: 8, h: 8 }; this.hitSet = new Set(); this.carry = []; this.spin = 0; }

    const p = G.player; this.spin += dt * 20;
    if (!this.back) { this.t -= dt; this.x += this.vx * dt; this.y += this.vy * dt; if (this.t <= 0) this.back = true; }
    else { const dx = p.cx() - 4 - this.x, dy = p.cy() - 8 - this.y, d = Math.hypot(dx, dy); if (d < 8) { this.dead = true; for (const c of this.carry) c.collect(); return; } this.x += dx / d * 260 * dt; this.y += dy / d * 260 * dt; }

    if (t && t.crystal && !this.hitSet.has('c' + tx + ty)) { this.hitSet.add('c' + tx + ty); hitCrystal(tx, ty); this.back = true; }

class Bomb extends Ent {
  constructor(x, y) { super(x, y); this.t = 1.8; this.hb = { x: 4, y: 6, w: 8, h: 8 }; }

// ============ 拾取物 ============
class Pickup extends Ent {
  constructor(x, y, item, n, persist) { super(x, y); this.item = item; this.n = n || 1; this.t = 0; this.life = persist ? 1e9 : 12; this.hb = { x: 3, y: 3, w: 10, h: 10 }; this.vy = persist ? 0 : -60; this.z = 0; }
  update(dt) {
    this.t += dt; this.life -= dt; if (this.life <= 0) { this.dead = true; return; }
    if (this.z < 0 || this.vy < 0) { this.vy += 300 * dt; this.z += this.vy * dt; if (this.z > 0) { this.z = 0; this.vy = 0; } }
    if (this.t > 0.25 && rectsOverlap(this.box(), G.player.box())) this.collect();
  }
  collect() {
    if (this.dead) return; this.dead = true;
    const it = this.item;
    if (it === 'heart') { S.hp = Math.min(S.maxhp, S.hp + 2); Sfx.play('pickup'); }
    else if (RUPEE_VAL[it]) { addRupees(RUPEE_VAL[it]); Sfx.play('coin'); }
    else if (it === 'arrow') { S.arrows = Math.min(S.maxArrows, S.arrows + this.n); Sfx.play('pickup'); }
    else if (it === 'bombs') { S.bombs = Math.min(S.maxBombs, S.bombs + this.n); Sfx.play('pickup'); }
  }
  draw(ctx, cx, cy) {
    if (this.life < 3 && Math.floor(this.life * 8) % 2) return;
    const x = Math.round(this.x - cx), y = Math.round(this.y - cy + this.z + Math.sin(this.t * 4) * 1.2);
    ctx.fillStyle = 'rgba(0,0,0,0.2)'; ctx.fillRect(Math.round(this.x - cx) + 4, Math.round(this.y - cy) + 13, 8, 2);
    ctx.drawImage(getIcon(ITEMS[this.item]), x + 2, y + 1, 12, 12);
  }
}
function spawnPickup(x, y, item, n) { const p = new Pickup(x, y, item, n); G.ents.push(p); return p; }
function dropLoot(x, y, p) {
  if (!chance(p)) return;
  const r = Math.random();
  if (r < 0.35 && S.hp < S.maxhp) spawnPickup(x, y, 'heart');
  else if (r < 0.45 && S.flags.bow) spawnPickup(x, y, 'arrow', 5);
  else if (r < 0.52 && S.flags.bombs) spawnPickup(x, y, 'bombs', 3);
  else spawnPickup(x, y, chance(0.15) ? 'rupee5' : 'rupee');
}

// ============ 宝箱 ============
class Chest extends Ent {
  constructor(spec) {
    super(spec.x * TS, spec.y * TS); this.spec = spec; this.solid = true; this.hb = { x: 1, y: 3, w: 14, h: 13 };
    this.open = isChestOpened(spec.cid); this.hidden = !this.open && !!spec.hidden; this.interact = true; this.appearT = 0;
  }
  update(dt) {

    if (!this.hidden) return;
    const h = this.spec.hidden;
    if (h === 'plate') { if (G.ents.some(e => e instanceof PushBlock && e.onPlate && e.spec.room === this.spec.room)) this.reveal(); }
    else if (roomCleared(this.spec.room)) this.reveal();

}
class PushBlock extends Ent {
  constructor(spec) { super(spec.x * TS, spec.y * TS); this.spec = spec; this.solid = true; this.hb = { x: 0, y: 0, w: 16, h: 16 }; this.moving = null; this.onPlate = false; this.home = [this.x, this.y]; }

  }

}

// ============ 地块交互 ============
function cutTile(tx, ty, t) {

  setT(m, tx, ty, BASE_TILE[m.under[ty * m.w + tx] || (t.tall ? GROUND_BASE[t.name] : 'grass')] || 'GRASS');

  } else {

function hitCrystal(tx, ty) {

      for (let x = 15; x >= 10; x--) { setT(m, x, 12, 'BRIDGE'); persistTile(x, 12); Sfx.play('door'); Particles.add(x * TS + 8, 12 * TS + 8, 6, '#c08850', 30, 0.3); await wait(0.12); }

<script>
/* js/systems.js */
'use strict';
// ============ 存档状态 ============
let S = null;
const SAVE_KEY = 'starisle_zelda_save_v1';
function newState() {
  return {
    v: 2, hp: 6, maxhp: 6, pieces: 0, rupees: 0, wallet: 99,
    bombs: 0, maxBombs: 20, arrows: 0, maxArrows: 30, potions: 0,
    items: {}, equip: null, tiny: false, fruits: 0,
    flags: {}, chests: {}, mods: {}, dng: {}, visited: {},
    map: 'home', px: 4 * TS, py: 5 * TS, dir: 0, playTime: 0,

}
function saveGame(silent) {
  try {
    const onSafe = G.map && !G.map.isDungeon && !G.map.mini;
    S.map = onSafe ? G.map.id : (G.safeMap || 'village');
    if (onSafe) { S.px = G.player.x; S.py = G.player.y; S.dir = G.player.dir; }
    else { const sp = G.safePos || { x: 18 * TS, y: 9 * TS }; S.px = sp.x; S.py = sp.y; }
    const st = Object.assign({}, S, { tiny: onSafe ? S.tiny : G.safeTiny || false });
    localStorage.setItem(SAVE_KEY, JSON.stringify(st));
    if (!silent) toast('游戏已保存');
    return true;
  } catch (e) { if (!silent) toast('保存失败'); return false; }
}
function loadSave() { try { const s = localStorage.getItem(SAVE_KEY); return s ? JSON.parse(s) : null; } catch (e) { return null; } }
function hasSave() { try { return !!localStorage.getItem(SAVE_KEY); } catch (e) { return false; } }

function addRupees(n) { S.rupees = Math.min(S.wallet, S.rupees + n); }
function persistTile(tx, ty) { const m = G.map; if (m.isDungeon || m.mini) return; (S.mods[m.id] = S.mods[m.id] || {})[ty * m.w + tx] = m.t[ty * m.w + tx]; }
function applyMods(m) {
  const mods = S.mods[m.id]; if (mods) for (const i in mods) m.t[i] = mods[i];
  if (m.isDungeon) { const d = dngState(m.dng); for (const door of m.doors) if (d.open[door.id]) for (const [x, y] of door.tiles) setT(m, x, y, 'DOPEN'); }
}
function dngState(id) { return S.dng[id] = S.dng[id] || { keys: 0, bossKey: false, boss: false, open: {}, visited: {} }; }
function chestKey(cid) { return G.map.id + ':' + cid; }
function isChestOpened(cid) { return !!S.chests[chestKey(cid)]; }
function markChestOpened(cid) { S.chests[chestKey(cid)] = 1; }

// ============ 道具 ============
function ownedItems() { return EQUIP_ORDER.filter(k => S.items[k]); }
function cycleItem(d) {
  const own = ownedItems(); if (!own.length) return;
  let i = own.indexOf(S.equip); i = (i + d + own.length) % own.length; S.equip = own[i]; Sfx.play('select');
  G.itemFlash = 0.6;
}
function giveItem(id) { S.items[id] = true; if (!S.equip) S.equip = id; }
function useItem(p) {
  if (!S.equip) { if (S.flags.gotSword) toast('还没有道具。K 键用来使用道具。'); return; }
  if (S.tiny) { toast('变小的时候不能用道具。'); return; }
  if (p.itemCD > 0) return;
  const it = S.equip, d = DIRS[p.dir];
  p.toolT = G.t + 0.25; p.toolItem = it;
  if (it === 'boomerang') { if (G.ents.some(e => e instanceof Boomerang)) return; G.ents.push(new Boomerang(p)); Sfx.play('swing'); p.itemCD = 0.2; }

    if (S.bombs <= 0) { toast('没有炸弹了！可以在商店买。'); Sfx.play('cancel'); return; }
    if (G.ents.filter(e => e instanceof Bomb).length >= 2) return;
    S.bombs--; G.ents.push(new Bomb(p.x + d[0] * 12, p.y + d[1] * 10 + 2)); Sfx.play('plant'); p.itemCD = 0.3;
  }
  else if (it === 'feather') { if (p.z > 0) return; p.vz = 175; p.z = 0.1; Sfx.play('bow'); p.itemCD = 0.1; }
  else if (it === 'bow') {
    if (S.arrows <= 0) { toast('没有箭了！可以在商店买。'); Sfx.play('cancel'); return; }
    S.arrows--; Sfx.play('bow'); shoot(p.cx() + d[0] * 6, p.cy() - 4 + d[1] * 6, d[0] * 240, d[1] * 240, 'arrow', 2, 'player'); p.itemCD = 0.35;
  }
}
// 变小 / 变大
function toggleTiny() {
  if (!S.flags.gotLeaf) { toast('一个发着微光的树桩……好像有什么魔力。'); return; }
  const p = G.player;
  runScript(async () => {
    const [tx, ty] = p.tilePos();
    p.x = tx * TS; p.y = ty * TS - (S.tiny ? 4 : 4);
    Sfx.play('warp');
    for (let i = 0; i < 6; i++) { Particles.add(p.cx(), p.cy() - 4, 4, pick(['#a0ffa0', '#ffffff', '#ffe080']), 50, 0.6); await wait(0.07); }

    if (!S.flags.toldTiny && S.tiny) { S.flags.toldTiny = true; await say('小叶', ['变小啦！现在可以钻进很小的洞里了。', '想变回来的话，再站到发光的树桩上按 J 就好！'], LEAF_LOOK); }

// ============ 受伤与死亡 ============
function hurtPlayer(dmg, sx, sy, noKb) {
  const p = G.player;
  if (p.hurtT > 0 || G.locked() || G.dead) return;
  S.hp -= dmg; p.hurtT = 1.0; Sfx.play('hurt'); G.shake = 0.15;
  if (!noKb) { const a = Math.atan2(p.cy() - sy, p.cx() - sx); p.kb = { x: Math.cos(a) * 160, y: Math.sin(a) * 160, t: 0.15 }; }

}
function playerDie() {
  if (S.potions > 0) {
    S.potions--; S.hp = S.maxhp; Sfx.play('heal');
    Particles.add(G.player.cx(), G.player.cy(), 30, '#ff80a0', 70, 0.8); toast('红药水救了你一命！');
    return;
  }
  G.dead = true;
  runScript(async () => {
    Sfx.play('fail');
    await wait(0.6);
    await fadeOut(0.8);
    G.dead = false;
    const c = await ask('你倒下了……', ['继续冒险', '存档并返回标题']);
    S.hp = Math.max(6, Math.floor(S.maxhp / 2));
    if (c === 1) { saveGame(true); location.reload(); return; }
    if (G.map.isDungeon) { const m = G.map; loadMap(m.id, m.start.x * TS - 8, m.start.y * TS - 12, 1); }
    else { S.tiny = G.safeTiny || false; loadMap(G.safeMap || 'village', G.safePos ? G.safePos.x : 18 * TS, G.safePos ? G.safePos.y : 9 * TS, 0); }
    await fadeIn(0.6);
  });
}

<script>
/* js/ui.js */
'use strict';
// ============ UI 栈 ============
const UI = {
  push(o) { G.ui.push(o); Input.clear(); return o; },
  pop(o) { const i = G.ui.indexOf(o); if (i >= 0) G.ui.splice(i, 1); Input.clear(); },
  top() { return G.ui[G.ui.length - 1]; },
};
const LEAF_LOOK = { tpl: 'sprout', a: '#9ae070', d: '#3a9a2a' };
function say(speaker, lines, look) { return new Promise(res => UI.push(new DialogUI(speaker, lines, look, res))); }
function ask(q, options, speaker, look) { return new Promise(res => UI.push(new ChoiceUI(q, options, speaker, look, res))); }
function bigMessage(title, sub, icon) { return new Promise(res => UI.push(new BigMsgUI(title, sub, icon, res))); }
function toast(text) { if (!text) return; G.toasts.push({ text, t: 3 }); if (G.toasts.length > 3) G.toasts.shift(); }
function runScript(fn) { G.scriptLock++; return Promise.resolve().then(fn).catch(e => console.error(e)).finally(() => { G.scriptLock--; }); }
function fadeOut(t) { return new Promise(res => { G.fade = { a: G.fade.a, to: 1, sp: 1 / (t || 0.4), res, busy: true }; }); }
function fadeIn(t) { return new Promise(res => { G.fade = { a: G.fade.a, to: 0, sp: 1 / (t || 0.4), res, busy: true }; }); }

class DialogUI {
  constructor(speaker, lines, look, res) { this.speaker = speaker; this.lines = (Array.isArray(lines) ? lines : [lines]).filter(l => l != null); this.look = look; this.res = res; this.i = 0; this.c = 0; this.wrapped = null; }
  update(dt) {
    const full = this.lines[this.i] || '';
    if (this.c < full.length) {
      const b = Math.floor(this.c); this.c += dt * 45;
      if (Math.floor(this.c) !== b && Math.floor(this.c) % 3 === 0) Sfx.play('text');
      if (Input.hit('a') || Input.hit('b')) this.c = full.length;
    } else if (Input.hit('a') || Input.hit('b')) {
      this.i++; this.c = 0; this.wrapped = null; Sfx.play('select');
      if (this.i >= this.lines.length) { UI.pop(this); this.res && this.res(); }
    }
  }
  draw(ctx) {
    const x = 4, h = 58, y = VH - h - 4, w = VW - 8;
    drawBox(ctx, x, y, w, h);
    let tx = x + 10;
    if (this.look) {
      ctx.fillStyle = '#e8d4a8'; ctx.fillRect(x + 7, y + 8, 42, 42); ctx.strokeStyle = '#b08a50'; ctx.strokeRect(x + 7.5, y + 8.5, 41, 41);

    }
    if (this.speaker) { const sw = textW(ctx, this.speaker, 10, true) + 14; drawBox(ctx, x + 4, y - 13, sw, 17, 'dark'); drawText(ctx, this.speaker, x + 11, y - 10, '#ffe8a0', 10, 'left', false, true); }
    if (!this.wrapped) this.wrapped = wrapText(ctx, this.lines[this.i] || '', w - (tx - x) - 12, 12);
    let n = Math.floor(this.c), yy = y + 9;
    for (const line of this.wrapped) { if (n <= 0) break; drawText(ctx, line.slice(0, n), tx, yy, '#3a2a1a', 12); n -= line.length; yy += 15; }
    if (this.c >= (this.lines[this.i] || '').length && Math.floor(G.t * 3) % 2) { ctx.fillStyle = '#a0602a'; ctx.beginPath(); ctx.moveTo(x + w - 16, y + h - 13); ctx.lineTo(x + w - 8, y + h - 13); ctx.lineTo(x + w - 12, y + h - 8); ctx.fill(); }
  }
}
class ChoiceUI {
  constructor(q, options, speaker, look, res) { this.opts = options; this.res = res; this.i = 0; this.dlg = q ? new DialogUI(speaker, [q], look, null) : null; if (this.dlg) this.dlg.c = 9999; }
  update() {
    if (Input.nav('up')) { this.i = (this.i + this.opts.length - 1) % this.opts.length; Sfx.play('select'); }
    if (Input.nav('down')) { this.i = (this.i + 1) % this.opts.length; Sfx.play('select'); }

      drawText(ctx, o, x + 20, y + 7 + i * 18, '#3a2a1a', 12);
    });

}
class BigMsgUI {
  constructor(title, sub, icon, res) { this.title = title; this.sub = sub; this.icon = icon; this.res = res; this.t = 0; Sfx.play('item'); }
  update(dt) { this.t += dt; if (this.t > 0.5 && (Input.hit('a') || Input.hit('b'))) { UI.pop(this); this.res && this.res(); } }
  draw(ctx) {
    ctx.fillStyle = 'rgba(0,0,0,0.45)'; ctx.fillRect(0, 0, VW, VH);

function navList(st, n) {

  if (Input.nav('up')) { st.i = (st.i + n - 1) % n; Sfx.play('select'); }
}

// ============ HUD ============
const HEART_PX = ['.kk.kk.', 'kaakaak', 'kaaaaak', '.kaaak.', '..kak..', '...k...'];
function drawHeart(ctx, x, y, fill, s) {

function itemCount(id) { return id === 'bombs' ? S.bombs : id === 'bow' ? S.arrows : null; }
function drawItemBox(ctx, x, y, label, id, flash) {

}
function drawHUD(ctx) {
  const hearts = S.maxhp / 2;
  for (let i = 0; i < hearts; i++) { const v = clamp(S.hp / 2 - i, 0, 1); drawHeart(ctx, 5 + (i % 10) * 11, 5 + Math.floor(i / 10) * 10, v >= 1 ? 1 : v > 0 ? 0.5 : 0); }

    ctx.drawImage(getIcon(ITEMS.key), 4, hy, 13, 13); drawText(ctx, '×' + d.keys, 17, hy + 2, '#fff', 9, 'left', '#000', true);

  else if (S.tiny) drawText(ctx, '小人模式', VW - 6, 36, '#a0ffa0', 9, 'right', '#000', true);

    const y = VH - 40 - (G.toasts.length - 1 - i) * 17;

    const w = textW(ctx, t.text, 10) + 14;

  });

// ============ 暂停菜单 ============

    if (Input.nav('up') && this.i >= 4) { this.i = 0; Sfx.play('select'); }
    if (!Input.hit('a')) return;
    if (this.i < 4) { const id = EQUIP_ORDER[this.i]; if (S.items[id]) { S.equip = id; Sfx.play('confirm'); G.itemFlash = 0.8; } return; }

function openShop() { return new Promise(res => UI.push(new ShopUI(res))); }
class ShopUI {

    });
  }
}

    for (let x = 0; x < VW; x += 16) { ctx.drawImage(getTileSprite(TILE.MGROUND, (x / 16) % 4, 0, 'forest', null), x, 148); ctx.drawImage(getTileSprite(TILE.MGROUND, (x / 16 + 1) % 4, 0, 'forest', null), x, 164); }
    ctx.drawImage(getTileSprite(TILE.MMUSH, 0, 0, 'forest', 'mground'), 24, 100, 48, 48);
    ctx.drawImage(getTileSprite(TILE.MACORN, 0, 0, 'forest', 'mground'), 252, 116, 32, 32);
    const bob = Math.sin(this.t * 3) * 1.5;
    ctx.save(); ctx.translate(VW / 2 - 12, 124); ctx.scale(1.5, 1.5); drawChar(ctx, HERO_LOOK, 0, Math.floor(this.t * 3) % 2, 0, 0); ctx.restore();
    drawMonLook(ctx, LEAF_LOOK, VW / 2 + 10, 116 + bob, 0.75);
    drawText(ctx, '星屿物语', VW / 2 + 2, 14, 'rgba(30,40,80,0.5)', 30, 'center', false, true);
    drawText(ctx, '星屿物语', VW / 2, 12, '#fff8d0', 30, 'center', false, true);
    drawText(ctx, '～ 小小勇者与守护古树 ～', VW / 2, 48, '#2a4a6a', 10, 'center');
    const bw = 110, bh = this.opts.length * 17 + 10, bx = VW / 2 - bw / 2, by = 62;
    drawBox(ctx, bx, by, bw, bh);
    this.opts.forEach((o, i) => {
      if (i === this.i) { ctx.fillStyle = 'rgba(200,140,60,0.25)'; ctx.fillRect(bx + 5, by + 5 + i * 17, bw - 10, 16); drawText(ctx, '▶', bx + 10, by + 8 + i * 17, '#c0602a', 9); }
      drawText(ctx, o[0], VW / 2, by + 7 + i * 17, '#3a2a1a', 11, 'center');

}
class CreditsUI {

<script>

// ============ 剧情 ============

function hintFor() {

// ============ 交互 ============
function findInteract(p) {
  const d = DIRS[p.dir], px = p.cx() + d[0] * 12, py = p.cy() + d[1] * 12;
  const near = (e, x, y) => { const b = e.box(); return x >= b.x - 4 && x <= b.x + b.w + 4 && y >= b.y - 5 && y <= b.y + b.h + 5; };

}
function talkTo(npc) {

function tryUnlock(tx, ty, t) {

// ============ 宝箱与奖励 ============
const OW_CHESTS = {
  field: [{ cid: 'fcrack', x: 33, y: 2, item: 'heartp' }],

};

  if (S.pieces >= 4) { S.pieces = 0; S.maxhp += 2; S.hp = S.maxhp; await bigMessage('生命上限 +1！', '心之碎片合成了一颗完整的心。', 'heartc'); }
}
const ITEM_GET = {
  boomerang: '按 K 扔出去，它会飞回来。\n能打晕敌人、打中远处的水晶开关！',

function openChestReward(spec) {
  runScript(async () => {

// ============ 头目 ============

  await fadeOut(1);
  S.flags.ending = true; S.tiny = false;
  loadMap('village', 18 * TS, 9 * TS - 4, 1);
  await new Promise(res => UI.push(new CreditsUI(res)));

  await say(NPCS.elder.name, ['古树……重新长出新叶了！谢谢你，小小的勇者！'], NPCS.elder.look);
  await say('小叶', ['冒险告一段落啦。不过世界上还有没找到的心之碎片哦！', '我会一直陪着你的。'], LEAF_LOOK);

<script>
/* js/main.js */
'use strict';
// ============ 游戏主体 ============
const G = {
  ui: [], ents: [], toasts: [], t: 0, shake: 0, scriptLock: 0, fade: { a: 0, to: 0, sp: 1 }, cam: { x: 0, y: 0 },
  map: null, player: null, state: 'title', flash: 0, banner: null, shut: [], shutT: 0, curRoomKey: null, roomEntry: null, itemFlash: 0,
  locked() { return this.ui.length > 0 || this.scriptLock > 0 || !!(this.fade && this.fade.busy) || !!this.dead; },
};
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let SCALE = 1;
function resize() {
  const dpr = window.devicePixelRatio || 1;
  const s = Math.min(window.innerWidth / VW, window.innerHeight / VH);
  canvas.style.width = Math.floor(VW * s) + 'px'; canvas.style.height = Math.floor(VH * s) + 'px';
  SCALE = Math.max(1, Math.round(s * dpr));
  canvas.width = VW * SCALE; canvas.height = VH * SCALE;
  ctx.imageSmoothingEnabled = false;
}
window.addEventListener('resize', resize);
function toggleFullscreen() { try { if (!document.fullscreenElement) document.documentElement.requestFullscreen(); else document.exitFullscreen(); } catch (e) { } }

// ============ 开始 ============
function startGame(state, isNew) {
  S = state;
  const fresh = newState(); for (const k in fresh) if (S[k] === undefined) S[k] = fresh[k];
  G.state = 'play';
  initMaps();
  G.player = new Player(0, 0);
  let id = S.map; if (!MAPDEF[id]) id = 'village';
  if (isNew) loadMap('home', 6 * TS, 4 * TS - 4, 0);
  else loadMap(id, S.px, S.py, S.dir);
  runScript(async () => {
    await fadeIn(0.8);
    if (isNew) {
      await say(NPCS.granny.name, ['早上好！今天可是村子一年一度的古树节呀。', '不过……守护古树最近好像没什么精神。', '长老在广场等你，快去看看吧！出门往右就是广场。'], NPCS.granny.look);
      toast('方向键移动，J 调查 / 对话');
    }
  });
}

// ============ 地图 ============
function loadMap(id, px, py, dir) {
  const m = getMap(id);
  G.map = m; applyMods(m);
  G.ents = []; G.shut = []; G.shutT = 0; G.curRoomKey = null; Particles.list = [];
  const p = G.player;
  p.x = px; p.y = py; if (dir != null) p.dir = dir;
  p.kb = null; p.atkT = 0; p.spinT = 0; p.charging = false; p.z = 0; p.vz = 0; p.hurtT = 0; p.safe = { x: px, y: py }; p.updHB();
  spawnMapEntities(m);
  updateCamera(true);
  Music.play(m.music);
  if (!m.isDungeon && !m.mini) { G.safeMap = id; G.safePos = { x: px, y: py }; G.safeTiny = S.tiny; S.visited[id] = 1; if (S.flags.gotLeaf) saveGame(true); }
  G.banner = { text: m.name + (m.isDungeon && dngState(m.dng).boss ? '（已完成）' : ''), t: 2 };

}
function spawnMapEntities(m) {
  for (const s of m.spawns) {
    if (s.type === 'enemy') G.ents.push(new Enemy(s.kind, s.x * TS, s.y * TS, s.room));
    else if (s.type === 'chest') G.ents.push(new Chest(s));
    else if (s.type === 'block') G.ents.push(new PushBlock(s));
    else if (s.type === 'boss') { if (!dngState(m.dng).boss) G.ents.push(new Boss(s.kind, s.x * TS, s.y * TS, s.room)); }

  }
  for (const [kind, n] of m.enemies || []) for (let i = 0; i < n; i++) for (let tries = 0; tries < 40; tries++) {
    const x = randi(2, m.w - 3), y = randi(2, m.h - 3), t = TILES[tAt(m, x, y)];
    if (t.solid || t.water || t.pit || t.tall || t.door || t.shrink || m.warps[y * m.w + x]) continue;
    if (Math.hypot(x * TS - G.player.x, y * TS - G.player.y) < 110) continue;
    G.ents.push(new Enemy(kind, x * TS, y * TS)); break;
  }
  for (const n of npcsForMap(m.id)) G.ents.push(n);
  for (const c of OW_CHESTS[m.id] || []) G.ents.push(new Chest(c));
}
function edgeExit(side) {
  const m = G.map, ex = m.exits[side], p = G.player, tm = getMap(ex.to);
  let nx = p.x, ny = p.y;
  if (side === 'e') { nx = -p.hb.x + 1; ny = p.y + ex.off * TS; }
  if (side === 'w') { nx = tm.w * TS - p.hb.x - p.hb.w - 1; ny = p.y + ex.off * TS; }
  if (side === 'n') { ny = tm.h * TS - p.hb.y - p.hb.h - 1; nx = p.x + ex.off * TS; }
  if (side === 's') { ny = -p.hb.y + 1; nx = p.x + ex.off * TS; }
  runScript(async () => { await fadeOut(0.2); loadMap(ex.to, nx, ny, p.dir); await fadeIn(0.2); });
}
function useWarp(w) {
  if (G.warpCD > 0) return;
  const p = G.player, [tx, ty] = p.tilePos(), t = tileProps(tx, ty);
  const back = () => { p.y += 6; G.warpCD = 0.6; };
  if (t && t.tinyPass) {
    runScript(async () => { Sfx.play('door'); await fadeOut(0.3); const m = getMap(w.to); loadMap(w.to, m.start.x * TS - 8, m.start.y * TS - 12, 1); await fadeIn(0.3); });
    return;
  }

  if (DUNGEONS[w.to]) {
    if (!S.flags.gotSword) { back(); toast('里面很危险，先去拿一把剑吧。'); return; }
    runScript(async () => {
      await fadeOut(0.4);
      const m = getMap(w.to); loadMap(w.to, m.start.x * TS - 8, m.start.y * TS - 12, 1);
      await fadeIn(0.4);
      if (!dngState(w.to).entered) { dngState(w.to).entered = true; await say('小叶', [`这里就是${DUNGEONS[w.to].name}……光之果实就在最深处。`, '找到钥匙打开锁住的门，宝箱里会有新道具！'], LEAF_LOOK); }
    });
    return;
  }
  runScript(async () => {
    Sfx.play('door'); await fadeOut(0.25);
    const m = getMap(w.to); loadMap(w.to, m.mat.x * TS, (m.mat.y - 1) * TS - 4, 1);
    await fadeIn(0.25);
  });
}
function exitInterior() {
  if (G.warpCD > 0) return;
  const m = G.map, back = m.isDungeon ? DUNGEONS[m.dng].from : INTERIOR_BACK[m.id];
  if (!back) return;
  runScript(async () => { Sfx.play('door'); await fadeOut(0.25); loadMap(back.map, back.x * TS, back.y * TS - 4, 0); await fadeIn(0.25); });
}

// ============ 摄像机 / 地下城房间 ============
function updateCamera(snap, dt) {
  const m = G.map, p = G.player;
  let tx = p.cx() - VW / 2, ty = p.cy() - VH / 2;
  let bx = 0, by = 0, bw = m.w * TS, bh = m.h * TS;
  if (m.isDungeon) {
    const key = Math.floor(p.cx() / (RW * TS)) + ',' + Math.floor(p.cy() / (RH * TS));
    if (key !== G.curRoomKey && m.rooms[key]) onEnterRoom(m.rooms[key]);
    const r = m.rooms[G.curRoomKey];
    if (r) { bx = r.ox * TS; by = r.oy * TS; bw = RW * TS; bh = RH * TS; }
  }
  tx = bw <= VW ? bx + (bw - VW) / 2 : clamp(tx, bx, bx + bw - VW);
  ty = bh <= VH ? by + (bh - VH) / 2 : clamp(ty, by, by + bh - VH);
  if (snap || !m.isDungeon) { G.cam.x = tx; G.cam.y = ty; }
  else { const k = Math.min(1, (dt || 0.016) * 10); G.cam.x = lerp(G.cam.x, tx, k); G.cam.y = lerp(G.cam.y, ty, k); if (Math.abs(G.cam.x - tx) < 0.5) G.cam.x = tx; if (Math.abs(G.cam.y - ty) < 0.5) G.cam.y = ty; }
}
function onEnterRoom(r) {
  const p = G.player, d = DIRS[p.dir];
  G.curRoomKey = r.key; G.roomEntry = { x: p.x + d[0] * 22, y: p.y + d[1] * 22 };
  dngState(G.map.dng).visited[r.key] = 1;
  G.shutT = 0.45;
  for (const e of G.ents) if (e instanceof PushBlock && e.spec.room === r.key && !e.onPlate) { e.x = e.home[0]; e.y = e.home[1]; }
  if (r.kind === 'boss' && !dngState(G.map.dng).boss) { Music.play('boss'); runScript(async () => { await wait(0.5); const b = G.ents.find(e => e instanceof Boss); if (b) { Sfx.play('boss'); G.banner = { text: b.k.name, t: 2.5 }; } }); }
}
function roomHasEnemies(key) { return G.ents.some(e => !e.dead && (e instanceof Enemy || e instanceof Boss) && e.room === key); }
function roomCleared(key) { return !roomHasEnemies(key); }
function closeShutters(r) {
  const pb = G.player.box();
  for (const [x, y] of r.doorTiles) if (rectsOverlap(pb, { x: x * TS, y: y * TS, w: TS, h: TS })) return false;
  G.shut = [];
  for (const [x, y] of r.doorTiles) if (TILES[tAt(G.map, x, y)].name === 'DOPEN') { setT(G.map, x, y, 'DSHUT'); G.shut.push([x, y]); }
  if (G.shut.length) Sfx.play('door');
  return true;
}
function openShutters() { for (const [x, y] of G.shut) setT(G.map, x, y, 'DOPEN'); if (G.shut.length) Sfx.play('unlock'); G.shut = []; }
function onEnemyKilled() { }
function openDoorAt(tx, ty) { const m = G.map; if (!m.doors) return; for (const d of m.doors) if (d.tiles.some(([x, y]) => x === tx && y === ty)) { openDoor(d); return; } }
function openDoor(d) {
  for (const [x, y] of d.tiles) setT(G.map, x, y, 'DOPEN');
  dngState(G.map.dng).open[d.id] = 1; Sfx.play('unlock');
  Particles.add(d.tiles[0][0] * TS + 16, d.tiles[0][1] * TS + 8, 16, '#ffe080', 60, 0.5);
}

// ============ 更新 ============
function update(dt) {
  Timers.update(dt);
  if (G.fade.busy) {
    const f = G.fade, dir = Math.sign(f.to - f.a); f.a += dir * f.sp * dt;
    if ((dir >= 0 && f.a >= f.to) || (dir < 0 && f.a <= f.to)) { f.a = f.to; f.busy = false; const r = f.res; f.res = null; r && r(); }
  }
  for (let i = G.toasts.length - 1; i >= 0; i--) { G.toasts[i].t -= dt; if (G.toasts[i].t <= 0) G.toasts.splice(i, 1); }
  if (G.banner) G.banner.t -= dt;
  if (G.itemFlash > 0) G.itemFlash -= dt;
  if (Input.hit('mute')) toast(Sfx.toggle() ? '声音：关' : '声音：开');
  if (Input.hit('full')) toggleFullscreen();
  const top = UI.top();
  if (G.state === 'play' && G.map) {
    if (!top) {
      if (Input.hit('menu') && !G.locked()) UI.push(new PauseUI());
      else {
        if (G.warpCD > 0) G.warpCD -= dt;
        S.playTime += dt;
        G.player.update(dt);
        const m = G.map;
        for (const e of G.ents) {
          if (e.dead) continue;
          if (m.isDungeon && e.room && e.room !== G.curRoomKey) continue;
          if (G.locked() && !(e instanceof Pickup) && !(e instanceof Explosion)) continue;
          e.update(dt);
        }
        G.ents = G.ents.filter(e => !e.dead);
        Particles.update(dt);
        if (G.shake > 0) G.shake -= dt;
        if (m.isDungeon && G.shutT > 0) { G.shutT -= dt; if (G.shutT <= 0 && roomHasEnemies(G.curRoomKey) && !closeShutters(m.rooms[G.curRoomKey])) G.shutT = 0.1; }
        if (m.isDungeon && G.shut.length && roomCleared(G.curRoomKey)) openShutters();
      }
    }
    updateCamera(false, dt);
  }
  if (top) top.update(dt);
}

// ============ 渲染 ============
function render() {
  ctx.setTransform(SCALE, 0, 0, SCALE, 0, 0); ctx.imageSmoothingEnabled = false;
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, VW, VH);
  if (G.state === 'play' && G.map && !G.ui.some(u => u instanceof CreditsUI)) { renderWorld(); drawHUD(ctx); }
  for (const u of G.ui) u.draw(ctx);
  if (G.flash > 0) { ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, VW, VH); }
  if (G.fade.a > 0) { ctx.fillStyle = `rgba(0,0,0,${clamp(G.fade.a, 0, 1)})`; ctx.fillRect(0, 0, VW, VH); }
}
function renderWorld() {
  const m = G.map;
  let cx = Math.round(G.cam.x), cy = Math.round(G.cam.y);
  if (G.shake > 0) { cx += randi(-2, 2); cy += randi(-2, 2); }
  const x0 = Math.floor(cx / TS), y0 = Math.floor(cy / TS), x1 = x0 + Math.ceil(VW / TS) + 1, y1 = y0 + Math.ceil(VH / TS) + 1;
  const f3 = Math.floor(G.t * 3) % 3;
  for (let y = Math.max(0, y0); y <= Math.min(m.h - 1, y1); y++) for (let x = Math.max(0, x0); x <= Math.min(m.w - 1, x1); x++) {
    const i = y * m.w + x, id = m.t[i], t = TILES[id];
    if (id === 0) continue;
    ctx.drawImage(getTileSprite(id, (hash2(x, y) * 4) | 0, t.anim ? (f3 + ((x + y) % 3)) % 3 : 0, m.theme, m.under[i]), x * TS - cx, y * TS - cy);
    if (t.water) {
      const px = x * TS - cx, py = y * TS - cy;
      const nb = (dx, dy) => { const n = tAt(m, x + dx, y + dy); return n > 0 && !TILES[n].water && !TILES[n].name.includes('BRIDGE'); };
      ctx.fillStyle = 'rgba(255,255,255,0.35)';
      if (nb(0, -1)) ctx.fillRect(px, py, 16, 2); if (nb(-1, 0)) ctx.fillRect(px, py, 1, 16); if (nb(1, 0)) ctx.fillRect(px + 15, py, 1, 16);
    }
  }
  const p = G.player, list = [];
  for (const e of G.ents) { if (e.dead) continue; if (m.isDungeon && e.room && e.room !== G.curRoomKey) continue; list.push(e); }
  list.push(p);
  list.sort((a, b) => a.sortY() - b.sortY());
  for (const e of list) {
    if (e === p && p.fallScale != null) { ctx.save(); ctx.translate(p.x - cx + 8, p.y - cy + 12); ctx.scale(p.fallScale, p.fallScale); ctx.translate(-8, -12); if (p.small) ctx.drawImage(tinySprite(), 4, 6); else drawChar(ctx, p.look, p.dir, 0, 0, 0); ctx.restore(); continue; }
    e.draw(ctx, cx, cy);
    if (e === p && !p.small && p.z === 0) { const tp = p.tileUnder(); if (tp && tp.tall) { const [tx, ty] = p.tilePos(); ctx.drawImage(getTileSprite(tAt(m, tx, ty), (hash2(tx, ty) * 4) | 0, 0, m.theme, null), 0, 10, 16, 6, Math.round(p.x - cx), Math.round(p.y - cy) + 11, 16, 6); } }
  }
  Particles.draw(ctx, cx, cy);
  if (m.labels) for (const l of m.labels) { const lx = l.x * TS - cx, ly = l.y * TS - cy; if (lx > -60 && lx < VW + 60 && ly > -20 && ly < VH) drawText(ctx, l.text, lx, ly, '#fff8e0', 9, 'center', 'rgba(0,0,0,0.75)', true); }
  // 交互提示气泡
  if (!G.locked() && G.state === 'play') {
    const tp = p.tileUnder();
    let hint = null;
    if (tp && tp.shrink && p.z === 0 && S.flags.gotLeaf) hint = S.tiny ? 'J 变大' : 'J 变小';
    else if (findInteract(p)) hint = 'J';
    if (hint) { const w = textW(ctx, hint, 9, true) + 8, hx = Math.round(p.cx() - cx - w / 2), hy = Math.round(p.y - cy) + (p.small ? 0 : -8) - 8 + Math.sin(G.t * 5); drawBox(ctx, hx, hy, w, 12, 'dark'); drawText(ctx, hint, hx + w / 2, hy + 1.5, '#ffe060', 9, 'center', false, true); }
  }
  if (m.mini) { const g = ctx.createRadialGradient(VW / 2, VH / 2, VH * 0.4, VW / 2, VH / 2, VH); g.addColorStop(0, 'rgba(40,80,20,0)'); g.addColorStop(1, 'rgba(20,40,10,0.45)'); ctx.fillStyle = g; ctx.fillRect(0, 0, VW, VH); }
}

// ============ 主循环 ============
let lastT = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - lastT) / 1000); lastT = now; G.t += dt;
  Input.update(dt);
  try { update(dt); render(); } catch (e) { console.error(e); }
  Input.endFrame();
  requestAnimationFrame(frame);
}

// ============ 触屏 ============
function setupTouch() {
  const el = document.getElementById('touch');
  if (!('ontouchstart' in window || navigator.maxTouchPoints > 0)) return;
  el.style.display = 'block';
  const pad = document.getElementById('dpad'); let padTouch = null;
  const setDir = t => {
    for (const k of ['up', 'down', 'left', 'right']) Input.release(k);
    if (!t) return;
    const r = pad.getBoundingClientRect(), dx = t.clientX - (r.left + r.width / 2), dy = t.clientY - (r.top + r.height / 2);
    if (Math.hypot(dx, dy) < 10) return;
    const a = Math.atan2(dy, dx);
    if (Math.cos(a) > 0.38) Input.press('right'); if (Math.cos(a) < -0.38) Input.press('left');
    if (Math.sin(a) > 0.38) Input.press('down'); if (Math.sin(a) < -0.38) Input.press('up');
  };
  pad.addEventListener('touchstart', e => { e.preventDefault(); padTouch = e.changedTouches[0].identifier; setDir(e.changedTouches[0]); Sfx.init(); }, { passive: false });
  pad.addEventListener('touchmove', e => { e.preventDefault(); for (const t of e.changedTouches) if (t.identifier === padTouch) setDir(t); }, { passive: false });
  const end = e => { e.preventDefault(); for (const t of e.changedTouches) if (t.identifier === padTouch) { padTouch = null; setDir(null); } };
  pad.addEventListener('touchend', end, { passive: false }); pad.addEventListener('touchcancel', end, { passive: false });
  for (const b of document.querySelectorAll('[data-act]')) {
    const act = b.dataset.act;
    b.addEventListener('touchstart', e => { e.preventDefault(); Input.press(act); b.classList.add('on'); }, { passive: false });
    const up = e => { e.preventDefault(); Input.release(act); b.classList.remove('on'); };
    b.addEventListener('touchend', up, { passive: false }); b.addEventListener('touchcancel', up, { passive: false });
  }
}

// ============ 启动 ============
function boot() {
  resize(); Input.init(); setupTouch();
  UI.push(new TitleUI()); Music.play('title');
  canvas.addEventListener('mousedown', () => Sfx.init());
  const bg = () => { if (G.state === 'play' && S && S.flags.gotLeaf && !G.dead) saveGame(true); };
  window.addEventListener('pagehide', bg);
  document.addEventListener('visibilitychange', () => { if (document.hidden) bg(); });
  requestAnimationFrame(frame);
}
boot();

</script>
